name: Fix avatars

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move avatar files to correct folder
        run: |
          NESTED="apps/android/app/src/main/res/drawable-nodpi/apps/android/app/src/main/res/drawable-nodpi"
          DEST="apps/android/app/src/main/res/drawable-nodpi"
          if [ -d "$NESTED" ]; then
            find "$NESTED" -maxdepth 1 -type f \( -name "*.jpg" -o -name "*.png" \) -exec mv {} "$DEST/" \;
            rm -rf "apps/android/app/src/main/res/drawable-nodpi/apps"
          fi
          ls -la "$DEST"
      - name: Commit
        run: |
          git config user.name "linji666"
          git config user.email "18665918439@163.com"
          git add -A
          git commit -m "把头像文件搬回正确目录" || echo "nothing to commit"
          git push
